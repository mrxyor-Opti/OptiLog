
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OptiLog v0.5.0</title>
<style>
body{font-family:Arial;max-width:1100px;margin:auto;padding:20px}
label{font-weight:bold;display:block;margin-top:8px}
input,select,textarea{width:100%;padding:8px}
.card{border:1px solid #ccc;padding:10px;margin:10px 0}
.thumb{max-width:100px;margin:3px}
.row{display:flex;gap:10px}
.row>*{flex:1}
</style>
</head>
<body>
<h1>OptiLog v0.5.0</h1>

<label>Číslo dílu</label><input id="part">
<label>Zakázka</label><input id="order">

<label>Stroj</label>
<select id="machine"></select>

<label>Status</label>
<select id="status">
<option>Otevřený</option>
<option>Vyřešený</option>
<option>Zmetek</option>
</select>

<label>Poznámka</label>
<textarea id="note"></textarea>

<label>Fotky</label>
<input id="photos" type="file" multiple accept="image/*">

<button onclick="saveIncident()">Uložit incident</button>
<button onclick="addMachine()">+ Přidat stroj</button>

<hr>

<div class="row">
<div>
<label>Filtr stroj</label>
<select id="machineFilter"></select>
</div>
<div>
<label>Filtr status</label>
<select id="statusFilter">
<option value="">Vše</option>
<option>Otevřený</option>
<option>Vyřešený</option>
<option>Zmetek</option>
</select>
</div>
</div>

<div id="history"></div>

<script>
let editId=null;

let machines=JSON.parse(localStorage.getItem("machines")||'["SPS","Q22Y","MRF","Centrování"]');
function saveMachines(){
 localStorage.setItem("machines",JSON.stringify(machines));
}

function refreshMachines(){
 machine.innerHTML="";
 machineFilter.innerHTML='<option value="">Vše</option>';
 machines.forEach(m=>{
   machine.innerHTML+=`<option>${m}</option>`;
   machineFilter.innerHTML+=`<option>${m}</option>`;
 });
}

function addMachine(){
 const m=prompt("Název stroje:");
 if(!m) return;
 machines.push(m);
 saveMachines();
 refreshMachines();
}

let db;
const req=indexedDB.open("OptiLogDB",2);

req.onupgradeneeded=e=>{
 db=e.target.result;
 if(!db.objectStoreNames.contains("incidents"))
   db.createObjectStore("incidents",{keyPath:"id",autoIncrement:true});

 if(!db.objectStoreNames.contains("photos")){
   let p=db.createObjectStore("photos",{keyPath:"id",autoIncrement:true});
   p.createIndex("incidentId","incidentId");
 }
};

req.onsuccess=e=>{
 db=e.target.result;
 refreshMachines();
 loadIncidents();
};

function saveIncident(){
 const incident={
   part:part.value,
   order:order.value,
   machine:machine.value,
   status:status.value,
   note:note.value,
   updated:new Date().toLocaleString()
 };

 const tx=db.transaction(["incidents"],"readwrite");
 const store=tx.objectStore("incidents");

 if(editId) incident.id=editId;

 store.put(incident).onsuccess=e=>{
   const id=editId || e.target.result;

   [...photos.files].forEach(f=>{
     db.transaction(["photos"],"readwrite")
       .objectStore("photos")
       .add({incidentId:id,blob:f});
   });

   editId=null;
   part.value="";
   order.value="";
   note.value="";
   photos.value="";

   setTimeout(loadIncidents,200);
 };
}

function loadIncidents(){
 if(!db) return;

 const hist=document.getElementById("history");
 hist.innerHTML="";

 db.transaction(["incidents"],"readonly")
 .objectStore("incidents")
 .getAll()
 .onsuccess=e=>{

   let rows=e.target.result.reverse();

   rows=rows.filter(r=>{
      const mf=machineFilter.value;
      const sf=statusFilter.value;
      return (!mf||r.machine===mf)&&(!sf||r.status===sf);
   });

   rows.forEach(r=>{

      const div=document.createElement("div");
      div.className="card";

      const statusIcon =
        r.status==="Otevřený"?"🟡":
        r.status==="Vyřešený"?"🟢":"🔴";

      div.innerHTML=`
      <b>INC-${String(r.id).padStart(6,"0")}</b><br>
      🏭 ${r.machine}<br>
      📦 ${r.part||""}<br>
      📋 ${r.order||""}<br>
      ${statusIcon} ${r.status}<br>
      📝 ${r.note||""}<br>
      <span id="p${r.id}">📷 ...</span><br>
      <button onclick="editIncident(${r.id})">Edit</button>
      `;

      hist.appendChild(div);

      const idx=db.transaction(["photos"],"readonly")
      .objectStore("photos").index("incidentId");

      idx.getAll(r.id).onsuccess=ev=>{
         const photosArr=ev.target.result;
         document.getElementById("p"+r.id).innerText="📷 "+photosArr.length;

         photosArr.forEach(ph=>{
            const img=document.createElement("img");
            img.className="thumb";
            img.src=URL.createObjectURL(ph.blob);
            div.appendChild(img);
         });
      };
   });
 };
}

function editIncident(id){
 db.transaction(["incidents"],"readonly")
 .objectStore("incidents")
 .get(id)
 .onsuccess=e=>{
   const r=e.target.result;
   editId=id;
   part.value=r.part||"";
   order.value=r.order||"";
   machine.value=r.machine||"";
   status.value=r.status||"Otevřený";
   note.value=r.note||"";
   window.scrollTo(0,0);
 };
}

machineFilter.onchange=loadIncidents;
statusFilter.onchange=loadIncidents;
</script>
</body>
</html>
